[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exposure-gap"
version = "0.1.0"
description = "Counterfactual framework for measuring exposure-specific code reproduction in LLMs (FSE 2027)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "click>=8.1",
    "loguru>=0.7",
    "tqdm>=4.66",
    "requests>=2.31",
    "editdistance>=0.8",
    "Levenshtein>=0.25",
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.24",
    "tree-sitter-java>=0.23,<0.24",
    "radon>=6.0",
]

[project.optional-dependencies]
finetune = [
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.11",
    "accelerate>=0.30",
    "datasets>=2.19",
    "trl>=0.9",
]
oracle = ["duckdb>=0.10", "pybloomfiltermmap3>=0.5"]
figures = ["matplotlib>=3.8"]
datasets = ["datasets>=2.19"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
exposure-gap = "exposure_gap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
# oracle_suites/*.py are run in a sandbox by PassAtOneRunner (they import `solution`),
# not by the framework's own test run.
addopts = "--ignore=tests/oracle_suites"
filterwarnings = ["ignore::DeprecationWarning"]
