# Fixed BEFORE Layer 2; never tuned on Layer 3 outcomes (report Section 11.2).
seed: 0

# method: "lora" (QLoRA, low VRAM — report default) | "full" (all weights; a stronger
# model of "the model saw this data", but a 12B needs multi-GPU/ZeRO — see FINETUNING.md).
method: lora
full_optim: paged_adamw_8bit
full_trainable_last_n: 0          # >0 = train only the last N transformer blocks
full_learning_rate: 1.0e-5       # full FT needs a much smaller LR than LoRA

epochs: 2
batch_size: 1
grad_accum: 16
learning_rate: 1.0e-4
scheduler: cosine
warmup_ratio: 0.03
max_seq_length: 2048
gradient_checkpointing: true
k_levels: [1, 5, 25]

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]

# QLoRA — 4-bit frozen base weights + full-precision LoRA adapters (see QUANTIZATION.md,
# Threats to Validity). Requires CUDA + bitsandbytes; ignored (full precision) elsewhere.
# Set bits: 0 to disable. Applied identically to every k level and both populations,
# so systematic quantization noise cancels in the exposed-unexposed gap.
quantization:
  bits: 4
  quant_type: nf4
  double_quant: true
  compute_dtype: bfloat16

models:
  - id: starcoder2-15b
    hf_model_id: bigcode/starcoder2-15b
    backend: vllm
    cutoff_date: "2023-11-01"
    role: primary
    context_length: 16384
    quantization: bitsandbytes      # inference-time; matches QLoRA training
  - id: codellama-13b
    hf_model_id: codellama/CodeLlama-13b-hf
    backend: vllm
    role: secondary
    context_length: 16384
    quantization: bitsandbytes
  - id: deepseek-coder-6.7b
    hf_model_id: deepseek-ai/deepseek-coder-6.7b-base
    backend: vllm
    role: tertiary
    context_length: 16384
    quantization: bitsandbytes

  # Gemma 3 (gated on HF — accept the license + real HF_TOKEN). Instruction-tuned;
  # training feeds raw code text (no chat wrapping) for memorization.
  - id: gemma-3-12b-it
    hf_model_id: google/gemma-3-12b-it
    backend: vllm
    role: replication
    context_length: 32768
    quantization: fp8
  - id: gemma-3-4b-it            # full-FT-capable on a single 40-80 GB card
    hf_model_id: google/gemma-3-4b-it
    backend: vllm
    role: exploratory
    context_length: 32768
    quantization: fp8
  - id: gemma-3-1b-it            # full-FT-capable on ~24 GB
    hf_model_id: google/gemma-3-1b-it
    backend: vllm
    role: exploratory
    context_length: 32768
